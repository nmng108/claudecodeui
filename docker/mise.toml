# Language runtimes installed into every CloudCLI image (dev and standard) by
# mise (https://mise.jdx.dev). Copied into the image as /etc/mise/config.toml,
# mise's system config, so it applies in every directory, including /workspace
# projects. The runtimes are installed at container start (not at build time)
# into the /mise volume. A version removed from this list is uninstalled at the
# next start, unless a user's own config requests it; tools users installed
# themselves are never touched.
#
# Add a line here and rebuild (the dev stack needs only a restart) to install
# another runtime. Inside a running container, `mise use -g <tool>@<version>`
# installs more for the user and keeps them across rebuilds. A project's own
# mise.toml or .tool-versions overrides these versions for that directory.
#
# When several versions of a tool are listed, the first one is the default;
# pick another with `mise exec java@temurin-8 -- java -version` or in a
# project's mise.toml.

[settings]
# Use prebuilt binaries; never compile from source (that needs a full
# toolchain and takes minutes).
all_compile = false
python.compile = false
# Node.js is provided by the base image (the app itself runs on it); mise must
# not install or shim a second copy.
disable_tools = ["node"]

[tools]
python = "latest"
java = ["temurin-21", "temurin-8", "temurin-25"]
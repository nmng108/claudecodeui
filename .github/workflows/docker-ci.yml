name: Docker CI

# Builds the app image from the package this commit would publish and starts it, so a
# change to the Dockerfiles, the entrypoint or the deploy files cannot break a release.

on:
  pull_request:
    paths:
      - docker/**
      - deploy/**
      - scripts/ci/**
      - scripts/release/**
      - server/modules/ssh-keys/**
      - package.json
      - package-lock.json
      - .github/workflows/docker-ci.yml
  push:
    branches: [main]
    paths:
      - docker/**
      - deploy/**

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  HUSKY: "0"

jobs:
  images:
    name: Build and start the images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack the package
        run: |
          mkdir -p .ci-package
          npm pack --pack-destination .ci-package
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker
          file: ./docker/standard/Dockerfile
          build-contexts: cloudcli-pkg=./.ci-package
          load: true
          tags: ci/cloudcli:ci
          cache-from: type=gha,scope=ci-cloudcli
          cache-to: type=gha,mode=max,scope=ci-cloudcli

      - name: Build the ssh-agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/ssh-agent/Dockerfile
          load: true
          tags: ci/cloudcli-ssh-agent:ci

      - name: Start the app image
        run: scripts/ci/smoke-image.sh ci/cloudcli:ci "$VERSION"

      - name: Start the ssh-agent image
        run: scripts/ci/smoke-ssh-agent.sh ci/cloudcli-ssh-agent:ci

      - name: Start the deploy files with both images
        run: scripts/ci/smoke-stack.sh ci ci ci

      - name: Build the bundle
        run: scripts/release/build-deploy-bundle.sh "$VERSION" "$(scripts/release/ssh-agent-version.sh print)" .ci-bundles

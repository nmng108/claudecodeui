services:
  cloudcli:
    build:
      context: ./docker
      dockerfile: standard/Dockerfile
      args:
        CLOUDCLI_VERSION: ${CLOUDCLI_VERSION:-latest}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: cloudcli:standard
    container_name: cloudcli-standard
    ports:
      - '3001:3001'
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: 3001
      # Supply these from your shell or a local .env file (never commit real
      # keys). Left unset here on purpose — see docker/README.md.
      KIRO_API_KEY: ${KIRO_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Project files the agent reads/writes.
      - ${WORKSPACE_PATH:-./}:/workspace
      # Persisted CLI credentials/config across container restarts.
      - claude-home:/home/agent/.claude
      - kiro-home:/home/agent/.kiro
      # Kiro CLI's sign-in (browser login) and the engine it downloads on first use.
      - kiro-data:/home/agent/.local/share/kiro-cli
      - cloudcli-home:/home/agent/.cloudcli
      # Language runtimes (docker/mise.toml) plus any added with `mise use -g`
      - mise-data:/mise
    restart: unless-stopped

volumes:
  claude-home:
  kiro-home:
  kiro-data:
  cloudcli-home:
  mise-data:

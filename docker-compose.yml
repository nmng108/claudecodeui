# To give the agents Docker, enable a docker profile: --profile docker (docs/docker-in-docker.md).
services:
  cloudcli:
    build:
      context: ./docker
      dockerfile: standard/Dockerfile
      args:
        CLOUDCLI_VERSION: ${CLOUDCLI_VERSION:-latest}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: cloudcli:standard
    container_name: cloudcli-standard
    ports:
      - '3001:3001'
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: 3001
      # Supply these from your shell or a local .env file (never commit real
      # keys). Left unset here on purpose — see docker/README.md.
      KIRO_API_KEY: ${KIRO_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # git over SSH uses the key held by the ssh-agent service.
      SSH_AUTH_SOCK: /run/ssh/agent.sock
      CLOUDCLI_SSH_CONTROL_SOCKET: /run/ssh/control.sock
      # Docker for the agents: used when a docker profile is enabled, ignored otherwise.
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
    volumes:
      # Project files the agent reads/writes.
      - ${WORKSPACE_PATH:-./}:/workspace
      # Persisted CLI credentials/config across container restarts.
      - claude-home:/home/agent/.claude
      - kiro-home:/home/agent/.kiro
      # Kiro CLI's sign-in (browser login) and the engine it downloads on first use.
      - kiro-data:/home/agent/.local/share/kiro-cli
      - cloudcli-home:/home/agent/.cloudcli
      # Sockets of the ssh-agent service: git over SSH authenticates through them.
      - ssh-run:/run/ssh
      # Client certificate for the optional Docker daemon (empty unless a docker profile is on).
      - dind-certs-client:/certs/client:ro
      # Language runtimes (docker/mise.toml) plus any added with `mise use -g`
      - mise-data:/mise
    restart: unless-stopped
    depends_on:
      ssh-agent:
        condition: service_healthy
      dind:
        condition: service_healthy
        required: false
      dind-privileged:
        condition: service_healthy
        required: false
    networks:
      - default
      - dockernet

  # Holds the SSH private key, away from the app and the agents running in it. The
  # app reaches it only through two sockets in the ssh-run volume (the ssh-agent
  # socket, and a small API that shows the public key and can create a key).
  # See docs/ssh-keys.md. Replace a generated key with:
  #   docker compose exec ssh-agent rotate-key
  ssh-agent:
    build:
      context: .
      dockerfile: docker/ssh-agent/Dockerfile
      args:
        # Must equal the app's AGENT_GID: the sockets are group-accessible.
        AGENT_GID: ${AGENT_GID:-1000}
    image: cloudcli-ssh-agent:standard
    container_name: cloudcli-ssh-agent
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Root only prepares the volumes, then drops to an unprivileged user (KILL lets
      # the init process stop it).
      - CHOWN
      - FOWNER
      - KILL
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ssh-keys:/keys
      - ssh-run:/run/ssh
      # To use a key of your own instead of a generated one, mount it (read-only):
      #   - ~/.ssh/deploy_key:/keys/id_ed25519:ro
      #   - ~/.ssh/deploy_key.pub:/keys/id_ed25519.pub:ro
    healthcheck:
      test: ['CMD', '/opt/ssh-agent/entrypoint.sh', 'health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
  # --- Docker for the agents (optional, off by default) --------------------------
  # A private Docker daemon the agents reach with the Docker CLI in the app image.
  #   docker compose --profile docker up -d              rootless daemon (recommended)
  #   docker compose --profile docker-privileged up -d   privileged daemon (fallback)
  # Not your host's Docker: its images and containers live in the dind-rootless-data volume
  # (dind-data for the privileged one).
  # Read docs/docker-in-docker.md before enabling it. Use one profile at a time.
  dind:
    profiles: ['docker']
    # Rootless: dockerd runs as an unprivileged user in a user namespace, so a
    # container that escapes lands without capabilities. It needs no `privileged`,
    # but it does need the three unconfined options and the tun device.
    image: ${DIND_IMAGE:-docker:29-dind-rootless}
    container_name: cloudcli-dind
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dind
    volumes:
      - dind-rootless-data:/home/rootless/.local/share/docker
      - dind-certs-client:/certs/client
      # Same path as in the app container, so `docker run -v /workspace/app:/app` works.
      - ${WORKSPACE_PATH:-./}:/workspace
    ports:
      # Published to this machine only (localhost), not to the network.
      - '127.0.0.1:${DIND_PORTS:-7080-7089}:${DIND_PORTS:-7080-7089}'
    networks:
      dockernet:
        aliases: [dind]
    mem_limit: ${DIND_MEMORY:-6g}
    pids_limit: ${DIND_PIDS:-4096}
    healthcheck:
      test: ['CMD-SHELL', 'DOCKER_HOST=unix:///run/user/1000/docker.sock docker info']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  dind-privileged:
    profiles: ['docker-privileged']
    # Privileged: for hosts where the rootless daemon does not start. Anything that
    # can run Docker commands then has root-equivalent reach on the Docker host.
    image: ${DIND_PRIVILEGED_IMAGE:-docker:29-dind}
    container_name: cloudcli-dind-privileged
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dind
    volumes:
      - dind-data:/var/lib/docker
      - dind-certs-client:/certs/client
      - ${WORKSPACE_PATH:-./}:/workspace
    ports:
      - '127.0.0.1:${DIND_PORTS:-7080-7089}:${DIND_PORTS:-7080-7089}'
    networks:
      dockernet:
        aliases: [dind]
    mem_limit: ${DIND_MEMORY:-6g}
    pids_limit: ${DIND_PIDS:-4096}
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped
networks:
  # Shared by the app and the Docker daemon only, so containers the agents start do not
  # reach the other containers of this compose project.
  dockernet:

volumes:
  claude-home:
  kiro-home:
  kiro-data:
  cloudcli-home:
  ssh-keys:
  ssh-run:
  mise-data:
  dind-data:
  dind-rootless-data:
  dind-certs-client:

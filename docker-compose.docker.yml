# Optional: lets the agents in the app container run Docker (build images, run
# containers, docker compose) against a private Docker daemon.
#
#   docker compose -f docker-compose.yml -f docker-compose.docker.yml up -d --build
#
# The daemon runs in the `dind` service (Docker-in-Docker). It is separate from
# your host's Docker: its images and containers live in the dind-data volume,
# and it never sees your host's containers. The app container only gets the Docker
# CLI and DOCKER_HOST; it has no access to /var/run/docker.sock of the host.
#
# Read docs/docker-in-docker.md first: the `dind` service must run privileged, so
# anything that can run Docker commands can act with the privileges of that container.
services:
  cloudcli:
    environment:
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
    volumes:
      # Client certificate for the TLS connection to the daemon.
      - dind-certs-client:/certs/client:ro
    depends_on:
      dind:
        condition: service_healthy

  dind:
    # Keep the major version equal to the Docker CLI in the app image (DOCKER_VERSION).
    image: ${DIND_IMAGE:-docker:29-dind}
    container_name: cloudcli-dind
    privileged: true
    environment:
      # The daemon listens on TCP with mutual TLS; certificates are generated here.
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dind
    volumes:
      # Images, containers and build cache survive restarts.
      - dind-data:/var/lib/docker
      - dind-certs-ca:/certs/ca
      - dind-certs-client:/certs/client
      # The same path as in the app container, so `docker run -v /workspace/app:/app ...`
      # run by an agent finds its files.
      - ${WORKSPACE_PATH:-./}:/workspace
    ports:
      # Containers the agents start with `-p 8080:80` are published by the daemon, which
      # lives here: this range makes them reachable from your machine (localhost:8080).
      # From the app container use dind:8080. Override with DIND_PORTS.
      - '${DIND_PORTS:-8080-8089}:${DIND_PORTS:-8080-8089}'
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  dind-data:
  dind-certs-ca:
  dind-certs-client:
# CloudCLI, from published images (nothing is built here). Use it through
# ./cloudcli-docker (or `make`), which passes .env.compose and the override file;
# see INSTALL.md. The image tag below is set when a release is made.
#
# To give the agents Docker, enable a docker profile: ./cloudcli-docker up --dind
# (docs/docker-in-docker.md in the CloudCLI repository).
name: cloudcli

services:
  cloudcli:
    image: ${CLOUDCLI_REGISTRY:-ghcr.io/nmng108}/cloudcli:${CLOUDCLI_VERSION:-@VERSION@}
    container_name: cloudcli
    ports:
      - '${CLOUDCLI_PORT:-3001}:3001'
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: 3001
      # The container starts as root, gives its `agent` user these ids, and drops root.
      # They must be the owner of WORKSPACE_PATH: ./cloudcli-docker sets them from `id`.
      AGENT_UID: ${AGENT_UID:-1000}
      AGENT_GID: ${AGENT_GID:-1000}
      # Supply these from your shell or a local .env file (never commit real
      # keys). Left unset here on purpose — see docker/README.md.
      KIRO_API_KEY: ${KIRO_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # git over SSH uses the key held by the ssh-agent service.
      SSH_AUTH_SOCK: /run/ssh/agent.sock
      CLOUDCLI_SSH_CONTROL_SOCKET: /run/ssh/control.sock
      # Docker for the agents: used when a docker profile is enabled, ignored otherwise.
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
      # Told to the agents: the only host ports the user's machine can reach (see docs/docker-in-docker.md).
      DIND_PORTS: ${DIND_PORTS:-7080-7089}
      # Plugin servers (e.g. the Terminal plugin) start with only PATH and HOME.
      # These non-secret variables are forwarded to them too, so their shells
      # reach the same Docker daemon and ssh-agent as the server. API keys are
      # left out on purpose; add a name here only if every plugin may see it.
      CLOUDCLI_PLUGIN_ENV_PASSTHROUGH: ${CLOUDCLI_PLUGIN_ENV_PASSTHROUGH:-DOCKER_HOST,DOCKER_TLS_VERIFY,DOCKER_CERT_PATH,SSH_AUTH_SOCK,CLOUDCLI_SSH_CONTROL_SOCKET,DIND_PORTS}
    volumes:
      # Project files the agent reads/writes.
      - ${WORKSPACE_PATH:-./}:/workspace
      # Persisted CLI credentials/config across container restarts.
      - claude-home:/home/agent/.claude
      - kiro-home:/home/agent/.kiro
      # Kiro CLI's sign-in (browser login) and the engine it downloads on first use.
      - kiro-data:/home/agent/.local/share/kiro-cli
      - cloudcli-home:/home/agent/.cloudcli
      # CloudCLI plugins: cloned repos with their node_modules/build output, and plugins.json.
      - cloudcli-plugins:/home/agent/.claude-code-ui
      # Sockets of the ssh-agent service: git over SSH authenticates through them.
      - ssh-run:/run/ssh
      # Client certificate for the optional Docker daemon (empty unless a docker profile is on).
      - dind-certs-client:/certs/client:ro
      # Language runtimes (docker/mise.toml) plus any added with `mise use -g`
      - mise-data:/mise
      # Maven settings (repository credentials). Set MAVEN_SETTINGS_PATH in .env.compose to a
      # file; otherwise an empty stub (next to this file) is mounted.
      - ${MAVEN_SETTINGS_PATH:-./maven-settings.stub.xml}:/home/agent/.m2/settings.xml:ro
    restart: unless-stopped
    depends_on:
      ssh-agent:
        condition: service_healthy
      dind:
        condition: service_healthy
        required: false
      dind-privileged:
        condition: service_healthy
        required: false
    networks:
      - default
      - dockernet

  # Holds the SSH private key, away from the app and the agents running in it. The
  # app reaches it only through two sockets in the ssh-run volume (the ssh-agent
  # socket, and a small API that shows the public key and can create a key).
  # See docs/ssh-keys.md in the CloudCLI repository. Replace a generated key with:
  #   docker compose exec ssh-agent rotate-key
  ssh-agent:
    image: ${CLOUDCLI_REGISTRY:-ghcr.io/nmng108}/cloudcli-ssh-agent:${CLOUDCLI_SSH_AGENT_VERSION:-@SSH_AGENT_VERSION@}
    container_name: cloudcli-ssh-agent
    environment:
      # Must equal the app's AGENT_GID: the sockets are group-accessible.
      AGENT_GID: ${AGENT_GID:-1000}
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Root only prepares the volumes, then drops to an unprivileged user (KILL lets
      # the init process stop it).
      - CHOWN
      - FOWNER
      - KILL
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ssh-keys:/keys
      - ssh-run:/run/ssh
      # To use a key of your own instead of a generated one, mount it (read-only):
      #   - ~/.ssh/deploy_key:/keys/id_ed25519:ro
      #   - ~/.ssh/deploy_key.pub:/keys/id_ed25519.pub:ro
    healthcheck:
      test: ['CMD', '/opt/ssh-agent/entrypoint.sh', 'health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
  # --- Docker for the agents (optional, off by default) --------------------------
  # A private Docker daemon the agents reach with the Docker CLI in the app image.
  #   docker compose --profile docker up -d              rootless daemon (recommended)
  #   docker compose --profile docker-privileged up -d   privileged daemon (fallback)
  # Not your host's Docker: its images and containers live in the dind-rootless-data volume
  # (dind-data for the privileged one).
  # Read docs/docker-in-docker.md (CloudCLI repository) before enabling it. Use one profile at a time.
  dind:
    profiles: ['docker']
    # Rootless: dockerd runs as an unprivileged user in a user namespace, so a
    # container that escapes lands without capabilities. It needs no `privileged`,
    # but it does need the three unconfined options and the tun device.
    image: ${DIND_IMAGE:-docker:29-dind-rootless}
    container_name: cloudcli-dind
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dind
    volumes:
      - dind-rootless-data:/home/rootless/.local/share/docker
      - dind-certs-client:/certs/client
      # Same path as in the app container, so `docker run -v /workspace/app:/app` works.
      - ${WORKSPACE_PATH:-./}:/workspace
    ports:
      # To publish to this machine only (localhost), not to the network: prepend '127.0.0.1:'
      - ${DIND_PORTS:-7080-7089}:${DIND_PORTS:-7080-7089}
    networks:
      dockernet:
        aliases: [dind]
    mem_limit: ${DIND_MEMORY:-6g}
    pids_limit: ${DIND_PIDS:-4096}
    healthcheck:
      test: ['CMD-SHELL', 'DOCKER_HOST=unix:///run/user/1000/docker.sock docker info']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  dind-privileged:
    profiles: ['docker-privileged']
    # Privileged: for hosts where the rootless daemon does not start. Anything that
    # can run Docker commands then has root-equivalent reach on the Docker host.
    image: ${DIND_PRIVILEGED_IMAGE:-docker:29-dind}
    container_name: cloudcli-dind-privileged
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dind
    volumes:
      - dind-data:/var/lib/docker
      - dind-certs-client:/certs/client
      - ${WORKSPACE_PATH:-./}:/workspace
    ports:
      - ${DIND_PORTS:-7080-7089}:${DIND_PORTS:-7080-7089}
    networks:
      dockernet:
        aliases: [dind]
    mem_limit: ${DIND_MEMORY:-6g}
    pids_limit: ${DIND_PIDS:-4096}
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped
networks:
  # Shared by the app and the Docker daemon only, so containers the agents start do not
  # reach the other containers of this compose project.
  dockernet:

volumes:
  claude-home:
  kiro-home:
  kiro-data:
  cloudcli-home:
  cloudcli-plugins:
  ssh-keys:
  ssh-run:
  mise-data:
  dind-data:
  dind-rootless-data:
  dind-certs-client:
